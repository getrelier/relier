# =============================================================================
# Relier Redis Sentinel — failover supervision.
#
# Three Sentinels monitor the master with a quorum of 2: a failover is
# authorised only when at least two Sentinels agree the master is down,
# which prevents a single isolated Sentinel from triggering split-brain.
#
# This file is copied to a writable path at container start because Sentinel
# rewrites its own config (discovered replicas, epochs) at runtime. Each
# Sentinel also receives `--sentinel announce-ip <hostname>` on the command
# line so peers can address it by container hostname.
# =============================================================================

port 26379
bind 0.0.0.0
protected-mode no
loglevel warning
dir /tmp

# Resolve and advertise hostnames instead of container IPs. Container IPs
# change across restarts; without this, Sentinel would pin to a stale IP.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# monitor <name> <master-host> <master-port> <quorum>
sentinel monitor relier-master relier-redis-master 6379 2

# Master is considered subjectively down after 5s of no response. This is
# deliberately below the 10s heartbeat_ttl so a Redis failover completes
# before Relier's worker-death detection reacts to the disruption.
sentinel down-after-milliseconds relier-master 5000

# Upper bound for a full failover cycle before it is retried.
sentinel failover-timeout relier-master 15000

# Reconfigure replicas one at a time after promotion so reads stay available.
sentinel parallel-syncs relier-master 1
