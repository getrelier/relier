# =============================================================================
# Relier Redis, data node baseline (master and replicas share this file).
#
# Replicas additionally receive `--replicaof relier-redis-master 6379` and
# `--replica-announce-ip <hostname>` on the command line so Sentinel can
# address them by container hostname.
#
# This file is copied to a writable path at container start because Redis
# (and Sentinel-driven failover) rewrites the active config via CONFIG REWRITE.
# =============================================================================

port 6379
bind 0.0.0.0
protected-mode no
loglevel warning

# --- Memory safety -----------------------------------------------------------
# Relier requires noeviction: under memory pressure, LRU/volatile policies
# would silently drop rl:phoenix:* job payloads. Enforced at worker bootstrap
# by relier.core.validation.validate_redis_config.
maxmemory-policy noeviction

# --- RDB snapshots -----------------------------------------------------------
# Kept as a fast-restart base and as the artifact the backup sidecar archives.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- AOF (append-only file) --------------------------------------------------
# Primary durability mechanism: every write is journalled and fsynced at most
# one second after it is acknowledged.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
# Write an RDB preamble at the head of the AOF so rewrites stay compact and
# load fast.
aof-use-rdb-preamble yes
# Keep fsyncing during a rewrite, favours durability over the latency spike.
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Replication -------------------------------------------------------------
# Replicas serve reads only; all Relier writes go to the Sentinel-elected
# master. A replica that loses contact with its master keeps serving stale
# reads rather than erroring, which is acceptable for failover bridging.
replica-read-only yes
replica-serve-stale-data yes
