repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=2000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # `uv run` without --frozen re-syncs the lockfile when pyproject.toml
        # has staged changes, which pre-commit then flags as "files were
        # modified by this hook" and aborts the commit. --frozen forbids the
        # implicit sync; --no-sync skips even the readonly env check.
        entry: uv run --frozen --no-sync mypy src
        language: system
        types: [python]
        pass_filenames: false
