[project]
name = "relier"
version = "0.1.4"
description = "Reliability layer for Celery. Zero job loss with task resurrection, idempotency, and graceful shutdown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kolade Fajimi", email = "fajimikolade23@gmail.com" }]
keywords = ["celery", "fastapi", "reliability", "production", "resilience"]
dependencies = [
    "celery[redis]>=5.6.3",
    "hiredis>=3.3.1",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-celery>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "orjson>=3.11.8",
    "redis>=6.4.0",
    "structlog>=25.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.2.0",
    "prometheus-client>=0.20.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-rerunfailures>=15.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.12",
    "testcontainers[redis]>=4.13.3",
]

[project.scripts]
rl = "relier.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relier"]

[tool.hatch.build.targets.wheel.force-include]
"src/relier/py.typed" = "relier/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src/relier --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.coverage.run]
parallel = true
source_pkgs = ["relier"]
concurrency = ["multiprocessing", "thread"]
sigterm = true
# Already measuring only src/relier because of --cov=src/relier
# But we can explicitly omit things we don't want to count yet
omit = [
    "src/relier/cli/*",
    "src/relier/chaos/*",
    "src/relier/*/__init__.py",
    "bench/*",
]

# Exclude from the final report
[tool.coverage.report]
omit = [
    "src/relier/cli/*",
    "src/relier/chaos/*",
    "src/relier/*/__init__.py",
    "bench/*",
]
show_missing = true
skip_covered = true

[tool.ruff]
# Set the maximum line length to 88 (standard Black compatibility)
line-length = 88
# Target Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`, `W`), and isort (`I`)
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"
# Indent with spaces, rather than tabs.
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = false
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "relier.tasks.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
