[project]
name = "relier"
version = "0.1.0"
description = "Production reliability layer for FastAPI + Celery. Zero job loss."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kolade Faj", email = "your@email.com" }]
keywords = ["celery", "fastapi", "reliability", "production", "resilience"]
dependencies = [
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.136.1",
    "hiredis>=3.3.1",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-celery>=0.62b1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "orjson>=3.11.8",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.46.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.2.0",
    "prometheus-client>=0.20.0",
    "pgvector>=0.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "testcontainers[postgres,redis]>=4.13.3",
]

[project.scripts]
rl = "relier.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relier"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/relier --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
# Set the maximum line length to 88 (standard Black compatibility)
line-length = 88
# Target Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`, `W`), and isort (`I`)
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"
# Indent with spaces, rather than tabs.
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Ignore missing stubs for third-party packages that don't have them
module = [
    "celery.*",
    "kombu.*",
]
ignore_missing_imports = true