name: relier-prod

# =============================================================================
# Production manifest, Redis HA topology.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Differences from the development stack (docker-compose.yml):
#   - No source bind-mounts and no --reload (code ships baked into the image).
#   - Redis data nodes and Sentinels require authentication.
#   - Memory limits are declared per service.
#   - Redis HA with Sentinel, authentication required.
#
# Required environment (provide via a .env file or the shell):
#   REDIS_PASSWORD      password for the Redis data nodes
#   SENTINEL_PASSWORD   password for the Sentinel instances
# =============================================================================

x-redis-node: &redis-node
  image: redis:7.2-alpine
  restart: unless-stopped
  healthcheck:
    # redis-cli picks up credentials from REDISCLI_AUTH automatically.
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5
  deploy:
    resources:
      limits:
        memory: 512M

x-redis-node-env: &redis-node-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
  REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

x-sentinel: &sentinel
  image: redis:7.2-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5
  deploy:
    resources:
      limits:
        memory: 128M

x-sentinel-env: &sentinel-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
  SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:?SENTINEL_PASSWORD must be set}
  REDISCLI_AUTH: ${SENTINEL_PASSWORD:?SENTINEL_PASSWORD must be set}

x-relier-env: &relier-env
  RELIER_REDIS_USE_SENTINEL: "true"
  RELIER_REDIS_SENTINEL_NODES: "relier-sentinel-1:26379,relier-sentinel-2:26379,relier-sentinel-3:26379"
  RELIER_REDIS_SENTINEL_MASTER_NAME: "relier-master"
  RELIER_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
  RELIER_REDIS_SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:?SENTINEL_PASSWORD must be set}
  # Large task checkpoints spill to the shared checkpoint volume instead of
  # bloating Redis. Small checkpoints still go inline. The directory below is
  # the redis_checkpoints volume mounted into every app service.
  RELIER_CHECKPOINT_BACKEND: "filesystem"
  RELIER_CHECKPOINT_DIR: "/var/lib/relier/checkpoints"
  RELIER_OTEL_ENABLED: "true"
  RELIER_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: *relier-env
  # Shared so a resurrected task can read a checkpoint written by whichever
  # worker originally ran it.
  volumes:
    - redis_checkpoints:/var/lib/relier/checkpoints
  deploy:
    resources:
      limits:
        memory: 1G
  depends_on:
    sentinel-1:
      condition: service_healthy
    sentinel-2:
      condition: service_healthy
    sentinel-3:
      condition: service_healthy
    otel-collector:
      condition: service_started

services:
  # ===========================================================================
  # Redis data plane, master + replicas (authenticated)
  # ===========================================================================
  redis-master:
    <<: *redis-node
    container_name: relier-redis-master
    environment: *redis-node-env
    command: >
      sh -c "cp /etc/relier/redis.conf /tmp/redis.conf &&
      exec redis-server /tmp/redis.conf
      --requirepass \"$$REDIS_PASSWORD\"
      --masterauth \"$$REDIS_PASSWORD\""
    volumes:
      - ./scripts/redis/redis.conf:/etc/relier/redis.conf:ro
      - redis_master_data:/data

  redis-replica-1:
    <<: *redis-node
    container_name: relier-redis-replica-1
    environment: *redis-node-env
    command: >
      sh -c "cp /etc/relier/redis.conf /tmp/redis.conf &&
      exec redis-server /tmp/redis.conf
      --replicaof relier-redis-master 6379
      --replica-announce-ip relier-redis-replica-1
      --requirepass \"$$REDIS_PASSWORD\"
      --masterauth \"$$REDIS_PASSWORD\""
    volumes:
      - ./scripts/redis/redis.conf:/etc/relier/redis.conf:ro
      - redis_replica1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy

  redis-replica-2:
    <<: *redis-node
    container_name: relier-redis-replica-2
    environment: *redis-node-env
    command: >
      sh -c "cp /etc/relier/redis.conf /tmp/redis.conf &&
      exec redis-server /tmp/redis.conf
      --replicaof relier-redis-master 6379
      --replica-announce-ip relier-redis-replica-2
      --requirepass \"$$REDIS_PASSWORD\"
      --masterauth \"$$REDIS_PASSWORD\""
    volumes:
      - ./scripts/redis/redis.conf:/etc/relier/redis.conf:ro
      - redis_replica2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy

  # ===========================================================================
  # Sentinel quorum (authenticated)
  # ===========================================================================
  sentinel-1:
    <<: *sentinel
    container_name: relier-sentinel-1
    environment: *sentinel-env
    command: >
      sh -c "cp /etc/relier/sentinel.conf /tmp/sentinel.conf &&
      exec redis-sentinel /tmp/sentinel.conf
      --sentinel announce-ip relier-sentinel-1
      --sentinel auth-pass relier-master \"$$REDIS_PASSWORD\"
      --requirepass \"$$SENTINEL_PASSWORD\""
    volumes:
      - ./scripts/redis/sentinel.conf:/etc/relier/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  sentinel-2:
    <<: *sentinel
    container_name: relier-sentinel-2
    environment: *sentinel-env
    command: >
      sh -c "cp /etc/relier/sentinel.conf /tmp/sentinel.conf &&
      exec redis-sentinel /tmp/sentinel.conf
      --sentinel announce-ip relier-sentinel-2
      --sentinel auth-pass relier-master \"$$REDIS_PASSWORD\"
      --requirepass \"$$SENTINEL_PASSWORD\""
    volumes:
      - ./scripts/redis/sentinel.conf:/etc/relier/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  sentinel-3:
    <<: *sentinel
    container_name: relier-sentinel-3
    environment: *sentinel-env
    command: >
      sh -c "cp /etc/relier/sentinel.conf /tmp/sentinel.conf &&
      exec redis-sentinel /tmp/sentinel.conf
      --sentinel announce-ip relier-sentinel-3
      --sentinel auth-pass relier-master \"$$REDIS_PASSWORD\"
      --requirepass \"$$SENTINEL_PASSWORD\""
    volumes:
      - ./scripts/redis/sentinel.conf:/etc/relier/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  # ===========================================================================
  # Backup sidecar
  # ===========================================================================
  redis-backup:
    image: redis:7.2-alpine
    container_name: relier-redis-backup
    restart: unless-stopped
    command: ["sh", "/backup.sh"]
    environment:
      BACKUP_REDIS_HOST: relier-redis-replica-1
      BACKUP_INTERVAL_SECONDS: "3600"
      BACKUP_RETENTION: "168"
      # redis-cli authenticates to the replica via REDISCLI_AUTH.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # Optional offsite copies, set BACKUP_S3_BUCKET to enable (image must
      # provide the `aws` CLI).
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    volumes:
      - ./scripts/redis/backup.sh:/backup.sh:ro
      - redis_replica1_data:/data:ro
      - redis_backups:/backups
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      redis-replica-1:
        condition: service_healthy

  # ===========================================================================
  # Application,  Celery workers and the resurrector
  # ===========================================================================
  worker-high:
    <<: *app
    command: >
      celery -A relier.tasks.app worker
      --loglevel=info
      --concurrency=8
      -Q high_priority,default
      --hostname=rl-worker-high@%h

  worker-default:
    <<: *app
    command: >
      celery -A relier.tasks.app worker
      --loglevel=info
      --concurrency=8
      -Q default,low_priority
      --hostname=rl-worker-default@%h

  worker-recovery:
    <<: *app
    command: >
      celery -A relier.tasks.app worker
      --loglevel=info
      --concurrency=8
      -Q re-queue
      --hostname=rl-worker-re-queue@%h

  resurrector:
    <<: *app
    container_name: relier-resurrector
    command: rl run-resurrector
    environment:
      <<: *relier-env
      RELIER_LOG_LEVEL: INFO

  # ===========================================================================
  # Observability,  OpenTelemetry → Prometheus → Grafana
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./scripts/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scripts/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M


volumes:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  redis_backups:
  # Shared checkpoint storage for the 'filesystem' checkpoint backend, mounted
  # into every app service so a resurrected task can read a checkpoint written
  # by a different worker.
  redis_checkpoints:
  prometheus_data:
  grafana_data:
