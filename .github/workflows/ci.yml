name: Relier CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on every PR targeting main, regardless of source branch name.
    # The previous glob-list silently skipped chore/, docs/, refactor/, etc.
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check src/

      - name: Run Ruff Formatter (Check)
        run: uv run ruff format --check src/

      - name: Run Mypy Type Checker
        run: uv run mypy src/

  test-unit:
    name: Unit Tests (>=95% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Relier and Dev Dependencies
        run: uv sync --all-groups

      - name: Run unit suite with 95% coverage gate
        run: |
          uv run pytest tests/unit/ \
            --cov=src/relier \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

  test-integration:
    name: Integration Tests (>=80% coverage)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Relier and Dev Dependencies
        run: uv sync --all-groups

      - name: Run integration suite with 80% coverage gate
        env:
          RELIER_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/integration/ \
            --cov=src/relier \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            --timeout=120 \
            --reruns 2 \
            --reruns-delay 1

  build-check:
    name: Validate Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build Package Wheels
        run: uv build
